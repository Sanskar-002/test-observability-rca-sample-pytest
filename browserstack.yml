userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

# Route selenium sessions to the BrowserStack preprod hub. The local SDK
# wrapper supports preprod/regression for smart selection, and the test
# user (e.g. ruturajshinde_R3UcaC) is preprod-scoped, so we override the
# default prod hub explicitly.
hubHost: hub-preprod.bsstag.com

# Static names — Smart Test Selection needs stable identifiers across runs.
# No dates / day-of-week / incremental tokens (per smart-selection docs).
# Shared project with the wdio sample so all bad-pr-causation builds
# accumulate together on observability.
projectName: bad-pr-causation-samples
buildName: bad-pr-causation-pytest

platforms:
  - os: Windows
    osVersion: '10'
    browserName: chrome
    browserVersion: latest

parallelsPerPlatform: 1
browserstackLocal: false

# Logging captures for RCA evidence
debug: true
networkLogs: true
consoleLogs: verbose
video: true

# Test Observability is the surface that hosts AI RCA + related_prs
testObservability: true

# Smart Test Selection wiring (the whole point of this repo).
# `relevantFirst` keeps all tests in scope but orders them by PR relevance,
# so each build still produces the full failure set the RCA needs to attribute.
testOrchestrationOptions:
  runSmartSelection:
    enabled: true
    mode: relevantFirst
    source: ./selection_config.json
